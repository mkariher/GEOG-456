 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<style>
    #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
    #map { height: 350px;

    #info {
        border: 1px solid black;

    background-color: blanchedalmond;}

            width: 10%;

<body>
    
<div id="container">
    <div id="map"></div>
    <div id="info"></div>
</div>
    <script>
       
        var map = L.map('map', {attributionControl: false }).setView([39.828175, -98.5795], 3);        
        var OpenStreetMap_Mapnik = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        opacity: .5,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
            
        function style(feature) {
            return {
                    fillColor: 'pink',
                    weight: 2,
                    opacity: 1,
                    color: 'white',
                    fillOpacity: 0.7
                };
            }

var myInfo = document.getElementById('info')


function myFunction(e) {
    var state = e.target.feature.properties.state
    var county = e.target.feature.properties.county
    var title = e.target.feature.properties.title
    var date = e.target.feature.properties.date 
    myInfo.innerHTML = "State: " + state + "<br>County: " + county + "<br>Date: " + date + "<br>" + title
}


function onEachFeature(feature, layer) {
    layer.on({mouseover: myFunction})
}

var bigfootIcon = L.icon({    
        iconUrl: 'bigfoot.png',   
        iconSize: [5,5],
        popupAnchor: [0,0] 
        });


 var bigfoot = L.geoJSON(bf.features, { 
    pointToLayer: function (feature, latlng) 
        { 
        return L.marker(latlng, {icon: bigfootIcon});},
    onEachFeature: onEachFeature
    }).addTo(map);

    </script>
</body>
